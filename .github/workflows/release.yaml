---
name: Release
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild image for (e.g. 0.1.19)'
        required: true
        type: string

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag and validate APP_VERSION
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          TAG_REF="${INPUT_TAG:-$EVENT_TAG}"
          VERSION="${TAG_REF#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG_REF' is not valid semver."
            exit 1
          fi

          echo "Fetching tag ref: $TAG_REF"
          if ! git fetch origin "refs/tags/${TAG_REF}:refs/tags/${TAG_REF}" --force --no-tags; then
            echo "::error::Tag '$TAG_REF' does not exist on origin."
            exit 1
          fi

          SHA=$(git rev-parse "refs/tags/${TAG_REF}^{commit}")
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve commit SHA for tag '$TAG_REF'."
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short=7 "$SHA")

          echo "Tag $TAG_REF -> commit $SHA (short: $SHORT_SHA)"

          TMPFILE=$(mktemp)
          git show "${SHA}:app.py" > "$TMPFILE"
          APP_VER=$(python3 scripts/read_app_version.py "$TMPFILE")
          rm -f "$TMPFILE"

          if [ "$APP_VER" != "$VERSION" ]; then
            echo "::error::APP_VERSION ($APP_VER) at tag $TAG_REF does not match normalized version ($VERSION)."
            exit 1
          fi
          echo "OK: APP_VERSION ($APP_VER) matches tag $TAG_REF"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-release
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PREBUILT_TAG: main-${{ needs.resolve-release.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Check for pre-built image from CI build
        id: prebuilt
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${PREBUILT_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Pre-built image ${PREBUILT_TAG} available; skipping rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pre-built image; will build from source."
          fi

      - name: Build and push Docker image
        id: build
        if: steps.prebuilt.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest from pre-built image
        if: steps.prebuilt.outputs.exists == 'true'
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p ${{ runner.temp }}/digests
          DIGEST=$(docker buildx imagetools inspect --raw \
            "ghcr.io/${{ github.repository }}:${PREBUILT_TAG}" 2>/dev/null \
            | jq -r --arg arch "$ARCH" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::Could not locate $ARCH digest in pre-built ${PREBUILT_TAG} manifest."
            exit 1
          fi
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Export digest
        if: steps.prebuilt.outputs.exists != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04-arm
    needs: [resolve-release, build]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.resolve-release.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |-
            type=raw,value=${{ needs.resolve-release.outputs.version }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ needs.resolve-release.outputs.version }}
