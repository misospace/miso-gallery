---
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests coverage

      - name: Verify app.py, pyproject.toml, and release-please manifest versions match
        run: |
          APP_VER=$(python3 scripts/read_app_version.py app.py)
          PYPROJ_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")
          if [ "$APP_VER" != "$PYPROJ_VER" ]; then
            echo "::error::pyproject.toml version ($PYPROJ_VER) does not match APP_VERSION ($APP_VER)."
            exit 1
          fi
          if [ "$APP_VER" != "$MANIFEST_VER" ]; then
            echo "::error::app.py APP_VERSION ($APP_VER) does not match .release-please-manifest.json version ($MANIFEST_VER)."
            exit 1
          fi
          echo "OK: app.py, pyproject.toml, and .release-please-manifest.json all report version $APP_VER"

      - name: Run unit tests
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=80
        env:
          SECRET_KEY: test-secret-ci-gateway

      - name: Create test images directory
        run: mkdir -p /tmp/test_images

      - name: Create test image
        run: |
          python3 -c "
          from PIL import Image
          img = Image.new('RGB', (100, 100), color='red')
          img.save('/tmp/test_images/test.png')
          "

      - name: Build test image
        run: docker build -t miso-gallery:test .

      - name: Run container
        run: |
          docker run -d --name gallery -p 5000:5000 -v /tmp/test_images:/data -e SECRET_KEY=test-secret-key-for-ci miso-gallery:test
          sleep 5

      - name: Wait for app and run smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5000/ >/dev/null; then
              echo "App is up"
              break
            fi
            echo "Waiting for app... ($i/20)"
            sleep 1
          done
          docker ps -a
          docker logs gallery || true
          curl -f http://localhost:5000/ || exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f gallery || true
