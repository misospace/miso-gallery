[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miso-gallery"
version = "0.3.0"
description = "A lightweight, self-hosted image gallery for AI-generated images"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.3,<4",
    "Pillow>=12.3.0,<13",
    "requests>=2.34.2,<3",
    "Werkzeug>=3.1.9,<4",
    "gunicorn>=26.2.0,<27",
    "Authlib>=1.9.1,<2",
    "redis>=8.1.0,<9",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.9,<1",
    "coverage>=7.5,<8",
]

# Flat py-modules list is deliberate: runtime modules live at the repo root, and
# Dockerfile/entrypoint.sh copy and run them from there, so a src/ layout would diverge.
[tool.setuptools]
py-modules = [
    "app",
    "auth",
    "gallery_scan",
    "health",
    "llm_api",
    "metadata",
    "oidc",
    "security",
    "tag_store",
    "thumbnails",
    "trash",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "conftest.py"]

[tool.coverage.report]
fail_under = 80
