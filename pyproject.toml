[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miso-gallery"
version = "0.5.0"
description = "A lightweight, self-hosted image gallery for AI-generated images"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.3,<4",
    "Pillow>=13,<14",
    "requests>=2.34.2,<3",
    "Werkzeug>=3.1.9,<4",
    "gunicorn>=27.0.1,<28",
    "Authlib>=1.9.5,<2",
    "redis>=8.1.0,<9",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.5,<1",
    "coverage>=7.17.3,<8",
]

# Flat py-modules list is deliberate: runtime modules live at the repo root, and
# Dockerfile/entrypoint.sh copy and run them from there, so a src/ layout would diverge.
# Decision (issue #547): the install is library-only by design. The wheel ships the
# Python modules and no data directories (templates/, assets/), so an installed copy
# is NOT runnable — Docker is the supported deploy path. Do not add package-data
# (or MANIFEST.in, which only affects the sdist) here; app.py fails at import with a
# message pointing at docs/runbook.md ("Packaging invariant").
[tool.setuptools]
py-modules = [
    "app",
    "auth",
    "gallery_scan",
    "health",
    "llm_api",
    "metadata",
    "oidc",
    "security",
    "tag_store",
    "thumbnails",
    "trash",
    "webhook_tasks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "conftest.py"]

[tool.coverage.report]
fail_under = 80
