[project]
name = "miso-gallery"
version = "0.2.1"
description = "A lightweight, self-hosted image gallery for AI-generated images"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.3,<4",
    "Pillow>=12.3.0,<13",
    "requests>=2.34.2,<3",
    "Werkzeug>=3.1.9,<4",
    "gunicorn>=26.2.0,<27",
    "Authlib>=1.9.1,<2",
    "redis>=8.1.0,<9",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.9,<1",
    "coverage>=7.5,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "conftest.py"]

[tool.coverage.report]
fail_under = 80
