# Development toolchain for miso-gallery (issue #553).
#
# Runtime tools are pinned here and locked in `.mise/mise.lock` (generated by
# `mise lock`; commit the result). Python is pinned to 3.15.1, the same 3.15
# release line as the Dockerfile runtime (python:3.15-slim); CI validates the
# 3.14 release line (see .github/workflows/tests.yaml) and `pyproject.toml`
# `requires-python` (>=3.11) is the compatibility floor. The Dockerfile runtime
# is the deployment target, not the development baseline.
# `mise run bootstrap` prepares the isolated venv; `mise run check` and
# `mise run test` are the targeted verification tasks. See CONTRIBUTING.md.
[settings]
# Task scripts abort on the first failing command (verified default for mise
# task `run` scripts; no extra settings required).

[tools]
python = "3.15.1"

# One-time, noninteractive, idempotent setup: install the pinned Python, build
# the project-local virtualenv, and install the project with dev extras from
# the single dependency authority (pyproject.toml). The bundled pip from the
# locked Python distribution is used unchanged, and the committed pip
# constraint lock pins the dependency and build-backend resolution. Build
# isolation is disabled after installing the constraint-locked setuptools so
# the backend cannot fetch an unpinned version. Never touches Git hooks or
# global config. Re-runs reuse an existing .venv built from the pinned Python.
# The task pins no package version of its own: the committed constraint lock
# is the single version authority, so advancing a constraint never needs a
# task edit.
[tasks.bootstrap]
description = "Install pinned Python and the project .venv with dev dependencies"
run = '''
mise install --locked python
expected="$(mise exec -- python3 -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
current="$(.venv/bin/python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])' 2>/dev/null || true)"
if [ "$current" != "$expected" ]; then
  rm -rf .venv
  mise exec -- python3 -m venv .venv
  echo "created .venv (Python $expected)"
else
  echo "reusing .venv (Python $current)"
fi
.venv/bin/python -m pip install -c .mise/requirements-constraints.txt setuptools
.venv/bin/python -m pip install --no-build-isolation -e '.[dev]' -c .mise/requirements-constraints.txt
.venv/bin/python -m pip check
echo "pinned python: $(mise where python)/bin/python3 (version $expected)"
echo "venv python:   $PWD/.venv/bin/python"
echo "OK: bootstrap complete; activate with 'source .venv/bin/activate' or use 'mise exec -- .venv/bin/pytest'"
'''

# Matches .github/workflows/lint.yaml (pyproject.toml alone selects a narrower
# rule set, so the flags are spelled out to replicate CI exactly).
[tasks.lint]
description = "Ruff lint (same flags as CI lint workflow)"
run = ".venv/bin/ruff check --select=E,F,W,B,SIM,I --ignore=E501 --statistics ."

# Repo invariants that CI gates releases on (cheap, no test suite run):
# the version contract (app.py, pyproject.toml, release-please manifest) and
# dependency consistency between pyproject.toml and requirements.txt.
[tasks.check]
description = "Lint plus repo version/dependency consistency checks"
depends = ["lint"]
run = '''
app_ver="$(.venv/bin/python scripts/read_app_version.py app.py)"
pyproj_ver="$(.venv/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
manifest_ver="$(.venv/bin/python -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
if [ "$app_ver" != "$pyproj_ver" ] || [ "$app_ver" != "$manifest_ver" ]; then
  echo "version mismatch: app.py=$app_ver pyproject.toml=$pyproj_ver .release-please-manifest.json=$manifest_ver" >&2
  exit 1
fi
.venv/bin/python scripts/check_dependency_consistency.py
echo "OK: check passed (versions $app_ver)"
'''

# Mirrors .github/workflows/tests.yaml unit-test job (same 80% coverage gate).
# No SECRET_KEY export needed: the root conftest.py sets a test-only key via
# os.environ.setdefault before pytest collects any test module (collection-time
# `import app` executes after conftest import), so this task runs clean without
# caller-supplied environment.
[tasks.test]
description = "Unit tests with the CI coverage gate (does not build Docker)"
run = '''
.venv/bin/python -m coverage run -m pytest -q
.venv/bin/python -m coverage report --fail-under=80
'''
